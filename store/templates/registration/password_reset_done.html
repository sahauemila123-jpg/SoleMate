{% extends "store/base.html" %}
{% block title %}Check Your Email | SoleMate{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <h1>Check your email</h1>
        <p class="sub">If an account exists with that email, we've sent a link to reset your password.</p>
        <div class="auth-switch"><a href="{% url 'login' %}">Back to log in</a></div>
    </div>
</div>
{% endblock %}
