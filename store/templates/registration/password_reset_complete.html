{% extends "store/base.html" %}
{% block title %}Password Changed | SoleMate{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <h1>Password changed</h1>
        <p class="sub">Your password has been updated. You can now log in with your new password.</p>
        <a href="{% url 'login' %}" class="auth-submit" style="display:block; text-align:center; text-decoration:none; line-height:1.6;">Log In</a>
    </div>
</div>
{% endblock %}
